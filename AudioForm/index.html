<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votación de audios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">VOTACIÓN</p>
      <h1>Elige tus 10 audios favoritos</h1>
      <p>Escucha los 45 audios y selecciona <strong>exactamente 10</strong>.</p>
      <div class="counter"><span id="selectedCount">0</span> / 10 seleccionados</div>
    </header>

    <section id="audioList" class="audio-list" aria-label="Lista de audios"></section>

    <section class="submit-card">
      <h2>Enviar votos</h2>
      <p id="selectionMessage">Te faltan 10 selecciones.</p>

      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="tu@email.com"
        disabled
      >

      <!-- Campo trampa sencillo para algunos bots. No lo ve el usuario. -->
      <div class="hp" aria-hidden="true">
        <label for="website">Página web</label>
        <input id="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button id="submitBtn" type="button" disabled>
        Enviar mis 10 votos
      </button>

      <p id="status" class="status" aria-live="polite"></p>
      <p class="privacy">
        El correo solo se utiliza para impedir que la misma dirección vote dos veces.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
